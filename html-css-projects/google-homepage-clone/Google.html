<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="Styles/Header.css">
    <link rel="stylesheet" href="Styles/General.css">
    <link rel="stylesheet" href="Styles/Main.css">
    <link rel="stylesheet" href="Styles/Search-bar.css">
    <link rel="stylesheet" href="Styles/Footer.css">
    <title>Google</title>
    <link rel="icon" type="image/x-icon" href="Icons/google-favicon.svg">
  </head>
  <body>

    <header>
      <div class="header-container">
        <div class="text-container">
          <div>
            <p class="text-1">Gmail</p>
          </div>
          <div>
            <p class="text-1">Images</p>
          </div>
        </div>
        <div class="google-apps-container">
          <div class="hover-background">
            <img class="google-apps-icon" src="Icons/google-apps-icon.svg">
            <div class="google-apps-tooltip">Google Apps</div>
          </div>
        </div>
        <div class="account-picture-container">
          <div class="hover-background">
            <img class="account-picture" src="Account-Pictures/account-picture.png">
            <div class="google-account-tooltip">
              <p>Google Account</p>
              <p class="text-2">Lukas Support</p>
              <p class="text-2">lukosiunaslukas70@gmail.com</p>
            </div>
          </div>
        </div>
      </div>
    </header>
    
    <main>
      <div class="google-logo-container">
        <img class="google-logo" src="Logos/google-logo.png">
      </div>

      <div>
        <div class="search-bar-container">
          <div class="border">
            <div class="icon-container">
              <div class="hover-background-small">
                <img class="search-bar-icon" src="Icons/upload-icon.svg">
                <div class="search-bar-icon-tooltip">
                  <p>Upload files or images</p>
                </div>
              </div>
            </div>
            <div class="input-container">
              <input class="search-bar" type="search">
            </div>
            <div class="icon-container">
              <img class="search-bar-icon" src="Icons/search-by-voice-icon.svg">
              <div class="search-bar-icon-tooltip-right">
                <p>Search by voice</p>
              </div>
            </div>
            <div class="icon-container">
              <img class="search-bar-icon" src="Icons/google-lens-icon.svg">
              <div class="search-bar-icon-tooltip-right">
                <p>Search by image</p>
              </div>
            </div>
            <button class="ai-mode-button">
              <img class="button-icon" src="Icons/AI-mode-icon.svg">
              <span>AI Mode</span>
            </button>
          </div>
        </div>
        <div class="buttons-container">
            <button class="middle-button">Google Search</button>
            <button class="middle-button">I'm Feeling Lucky</button>
        </div>
      </div>

      <div class="language-offer-container">
        <p>Google offered in: <a href="#" class="language-select">lietuvių</a></p>
      </div>

    </main>

    <footer>

            <div class="bottom-footer-container">
        <div class="left-side">
          <div class="text">
            <p>About</p>
          </div>
          <div class="text">
            <p>Advertising</p>
          </div>
          <div class="text">
            <p>Business</p>
          </div>
          <div class="text">
            <p>How Search works</p>
          </div>
        </div>
        <div class="right-side">
          <div class="text">
            <p>Privacy</p>
          </div>
          <div class="text">
            <p>Terms</p>
          </div>
          <div class="text">
            <p>Settings</p>
          </div>
        </div>
      </div>

      <div class="region-container">
        <div>
          <p class="region">Lithuania</p>
        </div>
      </div>

    </footer>

  </body>
</html>
